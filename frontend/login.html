<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Log in to your Recipe App account">
    <title>Login - Recipe App</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>

<header class="site-header" role="banner">
    <div class="container">
        <a href="index.html" class="logo">
            <span class="logo-icon">🍳</span>
            <span class="logo-text">Recipe App</span>
        </a>
        <nav class="main-nav">
            <a href="index.html" class="nav-link">Home</a>
            <a href="recipes.html" class="nav-link">Recipes</a>
            <div class="user-menu"></div>
        </nav>
    </div>
</header>

<main id="main-content" class="container auth-page">
    <div class="auth-card">
        <h1 class="auth-title">Welcome Back</h1>

        <div id="login-message" class="alert" style="display: none;" role="alert"></div>

        <form id="login-form" novalidate>
            <div class="form-group">
                <label for="username" class="form-label form-label-required">Username or Email</label>
                <input type="text" id="username" name="username" class="form-input"
                       required autocomplete="username" aria-describedby="username-help">
                <span id="username-help" class="form-help">Enter your username or email address.</span>
                <span id="username-error" class="form-error-message" role="alert"></span>
            </div>

            <div class="form-group">
                <label for="password" class="form-label form-label-required">Password</label>
                <input type="password" id="password" name="password" class="form-input"
                       required autocomplete="current-password">
                <span id="password-error" class="form-error-message" role="alert"></span>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg">Log In</button>
        </form>

        <p style="text-align: center; margin-top: var(--spacing-lg);">
            Don't have an account? <a href="register.html">Register here</a>.
        </p>
    </div>
</main>

<footer class="site-footer" role="contentinfo">
    <div class="container">
        <p>&copy; 2026 Recipe App.</p>
    </div>
</footer>

<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
