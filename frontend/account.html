<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Your Recipe App account">
    <title>My Account - Recipe App</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>

<header class="site-header" role="banner">
    <div class="container">
        <a href="index.html" class="logo">
            <span class="logo-icon">🍳</span>
            <span class="logo-text">Recipe App</span>
        </a>
        <button class="mobile-menu-btn" aria-expanded="false" aria-label="Toggle menu">☰</button>
        <nav class="main-nav">
            <a href="index.html" class="nav-link">Home</a>
            <a href="recipes.html" class="nav-link">Recipes</a>
            <a href="favourites.html" class="nav-link">Favourites</a>
            <div class="user-menu"></div>
        </nav>
    </div>
</header>

<main id="main-content" class="container" style="padding-top: var(--spacing-xl); padding-bottom: var(--spacing-xxl);">
    <h1>My Account</h1>

    <div class="card" style="padding: var(--spacing-xl); margin-bottom: var(--spacing-xl);">
        <h2>Profile</h2>
        <div id="profile-details">
            <!-- Populated by JavaScript if user is logged in -->
            <p>Please <a href="login.html">log in</a> to view your account.</p>
        </div>
    </div>

    <div class="card" style="padding: var(--spacing-xl);">
        <h2>Account Actions</h2>
        <a href="favourites.html" class="btn btn-primary">View Favourites</a>
        <button id="logout-btn" class="btn btn-outline">Logout</button>
    </div>
</main>

<footer class="site-footer" role="contentinfo">
    <div class="container">
        <p>&copy; 2026 Recipe App.</p>
    </div>
</footer>

<script src="js/app.js"></script>
<script>
    // Populate profile if logged in
    if (app.state.isAuthenticated) {
        const user = app.state.user;
        document.getElementById('profile-details').innerHTML = `
                <p><strong>Username:</strong> ${app.escapeHtml(user.username)}</p>
                <p><strong>Name:</strong> ${app.escapeHtml(user.full_name || 'Not set')}</p>
                <p><strong>Email:</strong> ${app.escapeHtml(user.email)}</p>
                <p><strong>Dietary Preference:</strong> ${app.escapeHtml(user.dietary_preference || 'None')}</p>
                <p><strong>Member since:</strong> ${app.formatDate(user.created_at || new Date())}</p>
            `;
    }
</script>
</body>
</html>
